<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <g id="moon-motif">
    <!-- Subtle Ambient Halo -->
    <circle cx="23" cy="24" r="21" fill="#FFE5A0" fill-opacity="0.18"/>
    <!-- Sleeping Crescent Moon Body -->
    <path d="M30 6 C20 8 13 17 13 27 C13 37 21 44 32 44 C34 44 36 43.5 38 43 C26 40 21 28 25 17 C26.8 12.5 30 9.2 33 7.5 C32 6.8 31 6.3 30 6 Z"
          fill="#FFE5A0" stroke="#81638E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sleepy Eye Arc -->
    <path d="M22 23 C23.5 25.5 26.5 25.5 28 23"
          stroke="#81638E" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheek Blush -->
    <ellipse cx="29" cy="28" rx="2.5" ry="1.8" fill="#F5C9DC" fill-opacity="0.9"/>
    <!-- Tiny Smile -->
    <path d="M23 29 C24.5 31 26.5 31 27.5 29.5"
          stroke="#81638E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Little Pink Bow on Moon Tip -->
    <g id="moon-bow" transform="translate(29, 6) scale(0.7)">
      <path d="M-4 -2 C-8 -4 -8 4 -4 2 Z" fill="#F5C9DC" stroke="#81638E" stroke-width="1.5"/>
      <path d="M4 -2 C8 -4 8 4 4 2 Z" fill="#F5C9DC" stroke="#81638E" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#F5C9DC" stroke="#81638E" stroke-width="1.5"/>
    </g>
  </g>
</svg>
