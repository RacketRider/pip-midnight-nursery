<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <g id="icon-nightlight">
    <!-- Soft Background Disc -->
    <rect x="4" y="4" width="56" height="56" rx="16" fill="#FFF4E7" stroke="#81638E" stroke-width="2"/>
    
    <!-- Outer Warm Light Halo -->
    <circle cx="32" cy="36" r="18" fill="#FFE5A0" fill-opacity="0.3"/>
    
    <!-- Top Brass Ring -->
    <circle cx="32" cy="14" r="5" stroke="#81638E" stroke-width="2" fill="#FFE5A0"/>
    
    <!-- Lantern Cap / Lid -->
    <path d="M24 22 C24 19 40 19 40 22 Z" fill="#C9B6E7" stroke="#81638E" stroke-width="2"/>
    
    <!-- Bell Dome -->
    <path d="M22 23 C22 23 20 42 20 44 C20 46 22 47 32 47 C42 47 44 46 44 44 C44 42 42 23 42 23 Z"
          fill="#FFF4E7" stroke="#81638E" stroke-width="2" stroke-linejoin="round"/>
          
    <!-- Glowing Star/Moon Center Motif -->
    <path d="M32 29 C32 33 29 35 26 35 C29 35 32 37 32 41 C32 37 35 35 38 35 C35 35 32 33 32 29 Z"
          fill="#FFE5A0" stroke="#81638E" stroke-width="1.5"/>
          
    <!-- Base Pedestal Ring -->
    <rect x="18" y="47" width="28" height="6" rx="3" fill="#F5C9DC" stroke="#81638E" stroke-width="2"/>
    
    <!-- Small sparkle accents -->
    <circle cx="15" cy="20" r="1.5" fill="#FFE5A0"/>
    <circle cx="49" cy="24" r="2" fill="#FFE5A0"/>
  </g>
</svg>
